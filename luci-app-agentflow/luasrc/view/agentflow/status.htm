<style>
.agentflow-shell {
	--af-panel:#fff;
	--af-panel-soft:#f5f7fb;
	--af-border:#d8deea;
	--af-text:#1d2638;
	--af-muted:#667085;
	--af-primary:#356cf6;
	--af-success:#168a45;
	--af-warning:#a15c00;
	display:grid;
	gap:16px;
	margin:12px 0 20px;
}
.agentflow-panel {
	box-sizing:border-box;
	padding:20px;
	border:1px solid var(--af-border);
	border-radius:10px;
	background:var(--af-panel);
	color:var(--af-text);
}
.agentflow-overview { display:grid; grid-template-columns:minmax(0, 1fr) minmax(280px, .8fr); gap:22px; }
.agentflow-service { display:flex; align-items:flex-start; gap:14px; }
.agentflow-service-icon {
	display:flex;
	align-items:center;
	justify-content:center;
	width:44px;
	height:44px;
	flex:0 0 44px;
	border-radius:50%;
	background:#fff2e3;
	color:var(--af-warning);
	font-size:20px;
	font-weight:800;
}
.agentflow-service-icon.running { background:#e8f7ee; color:var(--af-success); }
.agentflow-service h3, .agentflow-providers h3 { margin:0 0 6px; color:var(--af-text); }
.agentflow-service p, .agentflow-note { margin:0 0 14px; color:var(--af-muted); line-height:1.55; }
.agentflow-access { padding-left:22px; border-left:1px solid var(--af-border); }
.agentflow-access label { display:block; margin-bottom:7px; font-weight:700; }
.agentflow-address-row { display:flex; gap:8px; }
.agentflow-address-row input[type="text"] { min-width:0; flex:1 1 auto; }
.agentflow-button { min-height:38px; border-radius:7px !important; white-space:nowrap; }
.agentflow-primary { border-color:var(--af-primary) !important; background:var(--af-primary) !important; color:#fff !important; }
.agentflow-button:disabled { cursor:not-allowed; opacity:.55; }
.agentflow-provider-list { display:grid; gap:9px; margin-top:14px; }
.agentflow-provider {
	display:grid;
	grid-template-columns:minmax(150px, 1.2fr) minmax(120px, .8fr) minmax(80px, .5fr) auto;
	align-items:center;
	gap:12px;
	padding:12px 14px;
	border:1px solid var(--af-border);
	border-radius:8px;
	background:var(--af-panel-soft);
}
.agentflow-provider-name { font-weight:700; }
.agentflow-provider-state { color:var(--af-warning); font-weight:700; }
.agentflow-provider-state.ready { color:var(--af-success); }
.agentflow-provider-version { color:var(--af-muted); font-variant-numeric:tabular-nums; }
.agentflow-empty { padding:14px; border-radius:8px; background:var(--af-panel-soft); color:var(--af-muted); }
body[theme="dark"] .agentflow-shell {
	--af-panel:#202733;
	--af-panel-soft:#171d27;
	--af-border:#3b4658;
	--af-text:#edf2fb;
	--af-muted:#adb8cb;
	--af-primary:#5d88ff;
	--af-success:#50c878;
	--af-warning:#f0ad4e;
}
@media (prefers-color-scheme: dark) {
	body:not([theme]) .agentflow-shell {
		--af-panel:#202733;
		--af-panel-soft:#171d27;
		--af-border:#3b4658;
		--af-text:#edf2fb;
		--af-muted:#adb8cb;
		--af-primary:#5d88ff;
		--af-success:#50c878;
		--af-warning:#f0ad4e;
	}
}
@media (max-width:760px) {
	.agentflow-overview { grid-template-columns:1fr; }
	.agentflow-access { padding:18px 0 0; border-top:1px solid var(--af-border); border-left:0; }
	.agentflow-provider { grid-template-columns:1fr auto; }
	.agentflow-provider-version { grid-column:1; }
	.agentflow-provider-state { grid-column:2; grid-row:1; }
}
</style>

<script type="text/javascript">//<![CDATA[
var agentflowOpenUrl = '<%=url("admin/services/linkease_apps/open")%>?id=agentflow';
var agentflowStatusUrl = '<%=url("admin/services/agentflow_status")%>';
var agentflowLabels = {
	ready: '<%:Ready%>',
	notInstalled: '<%:Not installed%>',
	manage: '<%:Manage%>',
	version: '<%:Version%>',
	noProviders: '<%:No independent coding agent plugin was detected. Install Codex, Claude Code, OpenCode or Kimi from the app store.%>',
	copied: '<%:Copied%>'
};

function agentflowAbsoluteUrl(value) {
	if (!value) return '';
	try { return new URL(value, window.location.href).href; }
	catch (e) { return ''; }
}

function agentflowRenderProviders(providers) {
	var list = document.getElementById('agentflow-provider-list');
	if (!list) return;
	while (list.firstChild) list.removeChild(list.firstChild);
	if (!providers || !providers.length) {
		var empty = document.createElement('div');
		empty.className = 'agentflow-empty';
		empty.textContent = agentflowLabels.noProviders;
		list.appendChild(empty);
		return;
	}
	providers.forEach(function(provider) {
		var row = document.createElement('div');
		row.className = 'agentflow-provider';
		var name = document.createElement('div');
		name.className = 'agentflow-provider-name';
		name.textContent = provider.name || provider.id;
		var state = document.createElement('div');
		state.className = 'agentflow-provider-state' + (provider.installed ? ' ready' : '');
		state.textContent = provider.installed ? agentflowLabels.ready : agentflowLabels.notInstalled;
		var version = document.createElement('div');
		version.className = 'agentflow-provider-version';
		version.textContent = agentflowLabels.version + ': ' + (provider.version || '-');
		var action = document.createElement('a');
		action.className = 'btn cbi-button agentflow-button';
		action.textContent = agentflowLabels.manage;
		action.href = provider.manage_url || '#';
		if (!provider.manage_url) action.style.display = 'none';
		row.appendChild(name);
		row.appendChild(state);
		row.appendChild(version);
		row.appendChild(action);
		list.appendChild(row);
	});
}

function agentflowRenderStatus(status) {
	if (!status) return;
	var icon = document.getElementById('agentflow-service-icon');
	var title = document.getElementById('agentflow-service-title');
	var description = document.getElementById('agentflow-service-description');
	var openButton = document.getElementById('agentflow-open');
	var address = document.getElementById('agentflow-address');
	if (icon) {
		icon.className = 'agentflow-service-icon' + (status.running ? ' running' : '');
		icon.textContent = status.running ? '\u2713' : '!';
	}
	if (title) title.textContent = status.running ? '<%:AgentFlow service is running%>' : '<%:AgentFlow service is not running%>';
	if (description) description.textContent = status.running
		? '<%:The service is ready. AgentFlow uses independently installed coding agents.%>'
		: '<%:Start the service to use AgentFlow.%>';
	if (status.running && !(status.access && status.access.available) && description)
		description.textContent = '<%:Application entry is unavailable.%>';
	if (openButton) openButton.disabled = !(status.running && status.access && status.access.available);
	if (address) address.value = agentflowAbsoluteUrl(status.entry_url || '');
	agentflowRenderProviders(status.providers || []);
}

function agentflowCopyAddress() {
	var address = document.getElementById('agentflow-address');
	var feedback = document.getElementById('agentflow-copy-feedback');
	if (!address || !address.value) return;
	function done() {
		if (!feedback) return;
		feedback.textContent = agentflowLabels.copied;
		window.setTimeout(function() { feedback.textContent = ''; }, 1800);
	}
	if (navigator.clipboard && navigator.clipboard.writeText) {
		navigator.clipboard.writeText(address.value).then(done, function() {
			address.select(); document.execCommand('copy'); done();
		});
	} else {
		address.select(); document.execCommand('copy'); done();
	}
}

XHR.poll(5, agentflowStatusUrl, null, function(x, status) {
	agentflowRenderStatus(status);
});
//]]></script>

<div class="agentflow-shell">
	<section class="agentflow-panel agentflow-overview" aria-labelledby="agentflow-service-title">
		<div class="agentflow-service">
			<div id="agentflow-service-icon" class="agentflow-service-icon" aria-hidden="true">...</div>
			<div>
				<h3 id="agentflow-service-title"><%:Checking AgentFlow service%></h3>
				<p id="agentflow-service-description"><%:Collecting data...%></p>
				<input id="agentflow-open" class="btn cbi-button agentflow-button agentflow-primary" type="button" value="<%:Open AgentFlow%>" onclick="window.open(agentflowOpenUrl)" disabled>
			</div>
		</div>
		<div class="agentflow-access">
			<label for="agentflow-address"><%:Local network access%></label>
			<div class="agentflow-address-row">
				<input id="agentflow-address" type="text" readonly value="">
				<input class="btn cbi-button agentflow-button" type="button" value="<%:Copy%>" onclick="agentflowCopyAddress()">
			</div>
			<p class="agentflow-note"><%:AgentFlow keeps its own login and is exposed only through the application gateway.%> <span id="agentflow-copy-feedback" role="status" aria-live="polite"></span></p>
		</div>
	</section>

	<section class="agentflow-panel agentflow-providers" aria-labelledby="agentflow-providers-title">
		<h3 id="agentflow-providers-title"><%:Coding agents%></h3>
		<p class="agentflow-note"><%:Coding agents are installed and upgraded by their independent plugins. AgentFlow only invokes providers that are ready.%></p>
		<div id="agentflow-provider-list" class="agentflow-provider-list"></div>
	</section>
</div>
