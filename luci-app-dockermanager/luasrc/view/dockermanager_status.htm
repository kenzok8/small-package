<script type="text/javascript">//<![CDATA[
	XHR.poll(5, '<%=url("admin/services/dockermanager_status")%>', null,
		function(x, st)
		{
			var tb = document.getElementById('dockermanager_status');
			if (st && tb)
			{
					var status = st.running
						? '<br/><em style=\"color:green\"><%:The Docker Manager service is running.%></em>'
						: '<br/><em style=\"color:red\"><%:The Docker Manager service is not running.%></em>';
					if (st.access && st.access.available)
					{
						status += '<br/><em><%:Application entry is available.%></em>';
					}
					else
					{
						status += '<br/><em><%:Application entry is unavailable. Check the shared application entry service.%></em>';
					}
					tb.innerHTML = status;

				if (st.running && st.access && st.access.available)
				{
					tb.innerHTML = tb.innerHTML
						+ "<br/><br/><input class=\"btn cbi-button cbi-button-apply\" type=\"button\" value=\" <%:Open Docker Manager%> \" onclick=\"window.open('<%=url("admin/services/linkease_apps/open")%>?id=dockermanager')\"/>";
				}
			}
		}
	);
//]]></script>

<fieldset class="cbi-section">
	<legend><%:Docker Manager Status%></legend>
	<p id="dockermanager_status">
		<em><%:Collecting data...%></em>
	</p>
</fieldset>
