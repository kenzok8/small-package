<style type="text/css">
.kaiplus-actions {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 8px;
	margin: 16px;
}
.kaiplus-actions .cbi-button {
	min-height: 40px;
	transition: transform 120ms ease-out;
}
.kaiplus-actions .cbi-button:active {
	transform: scale(0.96);
}
</style>

<script type="text/javascript">//<![CDATA[
XHR.poll(2, '<%=url("admin/services/kaiplus_status")%>', null, function(x, st) {
	var el = document.getElementById('kaiplus_status');
	var openButton = document.getElementById('kaiplus-open');
	if (st && el) {
		var status = st.ready
			? '<br/><em style=\"color:green\"><%:The KaiPlus service is running.%></em>'
			: st.running
				? '<br/><em style=\"color:#d97706\"><%:The KaiPlus service is starting.%></em>'
				: '<br/><em style=\"color:red\"><%:The KaiPlus service is not running.%></em>';
		if (st.access && st.access.available) {
			status = status + '<br/><em><%:Application entry is available.%></em>';
		}
		else {
			status = status + '<br/><em><%:Application entry is unavailable. Check the shared application entry service.%></em>';
		}
		el.innerHTML = status;
		if (openButton) openButton.style.display = st.ready && st.access && st.access.available ? '' : 'none';
	}
});
//]]></script>

<fieldset class="cbi-section">
	<legend><%:Status%></legend>
	<p id="kaiplus_status">
		<em><%:Collecting data...%></em>
	</p>
	<div class="kaiplus-actions">
		<input id="kaiplus-open" class="btn cbi-button cbi-button-apply" type="button" value=" <%:Click to open KaiPlus%> " onclick="window.open('<%=url("admin/services/linkease_apps/open")%>?id=kaiplus')" style="display:none"/>
	</div>
</fieldset>
