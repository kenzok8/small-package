<%+tasks/embed%>
<style>
.kimi-shell{margin:14px 0;border:1px solid #dfe5ef;border-radius:12px;background:#fff;box-shadow:0 6px 20px rgba(30,45,80,.06);overflow:hidden}.kimi-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;padding:22px}.kimi-title{margin:0 0 7px;font-size:22px}.kimi-muted{margin:0;color:#667085;line-height:1.55}.kimi-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.kimi-badge{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:#eef2f7;color:#4a5568;font-size:13px;font-weight:700}.kimi-badge.kimi-ok{background:#e8f6ed;color:#16833b}.kimi-badge.kimi-warn{background:#fff3df;color:#955600}.kimi-actions{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.kimi-button{min-width:156px;text-align:center}.kimi-secondary{background:#fff!important}.kimi-guide{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 22px 18px;padding:15px 17px;border:1px solid #f0c36a;border-radius:9px;background:#fff8e8;color:#684400}.kimi-guide p{margin:4px 0 0;line-height:1.5}.kimi-guide a{flex:none}.kimi-detail{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;border-top:1px solid #e8edf4}.kimi-detail-copy{min-width:0;color:#667085;line-height:1.55}.kimi-detail-copy strong{color:#30384b}.kimi-maintenance{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}.kimi-state{font-weight:700}.kimi-ok{color:#16833b}.kimi-warn{color:#a15c00}body[theme="dark"] .kimi-shell{background:#20252b;border-color:#3c4652}body[theme="dark"] .kimi-guide{background:#3a3120;border-color:#7d622c;color:#ffe2a6}body[theme="dark"] .kimi-detail{border-color:#3c4652}body[theme="dark"] .kimi-secondary{background:#20252b!important}@media(max-width:800px){.kimi-main{grid-template-columns:1fr}.kimi-actions{align-items:stretch}.kimi-button{flex:1 1 210px}.kimi-guide,.kimi-detail{align-items:flex-start;flex-direction:column}.kimi-guide{margin:0 14px 14px}.kimi-guide a{width:100%;text-align:center}}
</style>
<script>
//<![CDATA[
var kimiStatusUrl='<%=url("admin/services/kimi/status")%>';
var kimiInstallUrl='<%=url("admin/services/kimi/install")%>';
var kimiTerminalUrl='<%=url("admin/services/linkease_apps/open")%>?id=kimi';
var kimiAgentFlowUrl='<%=url("admin/services/linkease_apps/open")%>?id=agentflow';
var kimiAgentFlowManageUrl='<%=url("admin/services/agentflow")%>';
var kimiMiseUrl='<%=url("admin/services/mise")%>';
var kimiStoreUrl='/cgi-bin/luci/admin/store';
var kimiToken=(window.taskd&&window.taskd.csrfToken)||'';
function kimiText(id,value,klass){var el=document.getElementById(id);if(!el)return;el.textContent=value;if(klass)el.className='kimi-state '+klass;}
function kimiBadge(id,value,klass){var el=document.getElementById(id);if(!el)return;el.textContent=value;el.className='kimi-badge '+(klass||'');}
function kimiAgentFlow(a){
 var button=document.getElementById('kimi-agentflow');if(!button)return;
 a=a||{};
 if(a.installed&&a.running){button.textContent='在网页中使用 Kimi Code';button.href=kimiAgentFlowUrl;button.target='_blank';button.title='由 AgentFlow 提供';return}
 button.removeAttribute('target');
 if(a.installed){button.textContent='启动或管理 AgentFlow';button.href=kimiAgentFlowManageUrl;button.title='AgentFlow 当前未运行';return}
 button.textContent='安装 AgentFlow 后使用';button.href=kimiStoreUrl;button.title='前往 iStore 安装 AgentFlow';
}
function kimiRender(s){
 s=s||{};var runtime=s.runtime||{},storageReady=runtime.storage_configured===true;
 kimiBadge('kimi-install-state',s.installed?('Kimi Code '+(s.version||'已安装')):(s.install_running?'Kimi Code 正在安装':'Kimi Code 未安装'),s.installed?'kimi-ok':'kimi-warn');
 kimiBadge('kimi-terminal-state',s.service_running?'终端运行中':'终端未运行',s.service_running?'kimi-ok':'kimi-warn');
 kimiBadge('kimi-auth-state',s.authenticated?'Kimi 已登录':'Kimi 未登录',s.authenticated?'kimi-ok':'kimi-warn');
 var runtimeText=!storageReady?'尚未配置共享运行时存储':runtime.ready?('共享运行时：Node '+runtime.node+' · npm '+runtime.npm+' · '+runtime.abi):s.install_running?'正在准备共享运行时':!s.installed?'共享运行时将在安装 Kimi Code 时自动准备':(runtime.error||'共享运行时需要检查');
 kimiText('kimi-runtime-state',runtimeText,runtime.ready?'kimi-ok':'kimi-warn');
 var guide=document.getElementById('kimi-storage-guide');guide.style.display=storageReady?'none':'flex';
 var install=document.getElementById('kimi-install');install.disabled=!!s.install_running||!storageReady;install.title=storageReady?'':'请先配置运行时存储';install.value=s.installed?'重新安装固定版本':(s.install_running?'正在安装…':'安装 Kimi Code');
 document.getElementById('kimi-recover').style.display=s.interrupted?'inline-block':'none';
 var terminal=document.getElementById('kimi-terminal');terminal.href=kimiTerminalUrl;terminal.style.display=s.service_running?'inline-block':'none';
 kimiAgentFlow(s.agentflow);
}
function kimiOperation(operation){
 (new XHR()).post(kimiInstallUrl,{token:kimiToken,operation:operation},function(x,data){
  data=data||{};if(!data.ok){if(data.next==='runtime-storage'){location.href=kimiMiseUrl;return}alert(data.error||'操作失败');return}
  if(data.task_id&&window.taskd)window.taskd.show_log(data.task_id,false,function(){location.reload()});
  else location.reload();
 });
}
XHR.poll(5,kimiStatusUrl,null,function(x,s){kimiRender(s)});
//]]>
</script>
<section class="kimi-shell" aria-labelledby="kimi-heading">
 <div class="kimi-main">
  <div><h3 id="kimi-heading" class="kimi-title">Kimi Code</h3><p class="kimi-muted">在 iStoreOS 上安全运行 Kimi Code 命令行，也可以交给 AgentFlow 提供网页工作流。</p><div class="kimi-badges"><span id="kimi-install-state" class="kimi-badge">检查中…</span><span id="kimi-terminal-state" class="kimi-badge">检查中…</span><span id="kimi-auth-state" class="kimi-badge">检查中…</span></div></div>
  <div class="kimi-actions"><a id="kimi-terminal" class="btn cbi-button cbi-button-apply kimi-button" target="_blank" rel="noopener" style="display:none">打开 Kimi Code 命令行</a><a id="kimi-agentflow" class="btn cbi-button kimi-button kimi-secondary" rel="noopener">检查 AgentFlow…</a></div>
 </div>
 <div id="kimi-storage-guide" class="kimi-guide" role="status" style="display:none"><div><strong>先配置运行时存储</strong><p>Kimi Code 需要把固定 Node/npm 环境保存在持久硬盘。请先选择并保存存储目录，再返回安装。</p></div><a class="btn cbi-button cbi-button-apply" href="<%=url('admin/services/mise')%>">前往运行时环境</a></div>
 <div class="kimi-detail"><div class="kimi-detail-copy"><strong id="kimi-runtime-state" class="kimi-state">检查共享运行时…</strong><br>Kimi 凭据仅保存在专用 Kimi Code HOME；未登录时请在命令行执行 <code>kimi login</code>。</div><div class="kimi-maintenance"><a class="btn cbi-button" href="<%=url('admin/services/mise')%>">运行时环境</a><input id="kimi-install" class="btn cbi-button" type="button" value="安装 Kimi Code" onclick="kimiOperation('install')"><input id="kimi-recover" class="btn cbi-button" style="display:none" type="button" value="恢复中断安装" onclick="kimiOperation('recover')"></div></div>
</section>
