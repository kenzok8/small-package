<%+tasks/embed%>
<style>
.opencode-shell{margin:14px 0;border:1px solid #dfe5ef;border-radius:12px;background:#fff;box-shadow:0 6px 20px rgba(30,45,80,.06);overflow:hidden}.opencode-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;padding:22px}.opencode-title{margin:0 0 7px;font-size:22px}.opencode-muted{margin:0;color:#667085;line-height:1.55}.opencode-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.opencode-badge{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:#eef2f7;color:#4a5568;font-size:13px;font-weight:700}.opencode-badge.opencode-ok{background:#e8f6ed;color:#16833b}.opencode-badge.opencode-warn{background:#fff3df;color:#955600}.opencode-actions{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.opencode-button{min-width:156px;text-align:center}.opencode-secondary{background:#fff!important}.opencode-detail{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;border-top:1px solid #e8edf4}.opencode-detail-copy{min-width:0;color:#667085;line-height:1.55}.opencode-detail-copy strong{color:#30384b}.opencode-maintenance{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}.opencode-state{font-weight:700}.opencode-ok{color:#16833b}.opencode-warn{color:#a15c00}body[theme="dark"] .opencode-shell{background:#20252b;border-color:#3c4652}body[theme="dark"] .opencode-detail{border-color:#3c4652}body[theme="dark"] .opencode-secondary{background:#20252b!important}@media(max-width:800px){.opencode-main{grid-template-columns:1fr}.opencode-actions{align-items:stretch}.opencode-button{flex:1 1 210px}.opencode-detail{align-items:flex-start;flex-direction:column}}
</style>
<script>
//<![CDATA[
var opencodeStatusUrl='<%=url("admin/services/opencode/status")%>';
var opencodeInstallUrl='<%=url("admin/services/opencode/install")%>';
var opencodeTerminalUrl='<%=url("admin/services/linkease_apps/open")%>?id=opencode';
var opencodeAgentFlowUrl='<%=url("admin/services/linkease_apps/open")%>?id=agentflow';
var opencodeAgentFlowManageUrl='<%=url("admin/services/agentflow")%>';
var opencodeStoreUrl='/cgi-bin/luci/admin/store';
var opencodeToken=(window.taskd&&window.taskd.csrfToken)||'';
function opencodeText(id,value,klass){var el=document.getElementById(id);if(!el)return;el.textContent=value;if(klass)el.className='opencode-state '+klass;}
function opencodeBadge(id,value,klass){var el=document.getElementById(id);if(!el)return;el.textContent=value;el.className='opencode-badge '+(klass||'');}
function opencodeAgentFlow(a){
 var button=document.getElementById('opencode-agentflow');if(!button)return;
 a=a||{};
 if(a.installed&&a.running){button.textContent='在网页中使用 OpenCode';button.href=opencodeAgentFlowUrl;button.target='_blank';button.title='由 AgentFlow 提供';return}
 button.removeAttribute('target');
 if(a.installed){button.textContent='启动或管理 AgentFlow';button.href=opencodeAgentFlowManageUrl;button.title='AgentFlow 当前未运行';return}
 button.textContent='安装 AgentFlow 后使用';button.href=opencodeStoreUrl;button.title='前往 iStore 安装 AgentFlow';
}
function opencodeRender(s){
 s=s||{};var runtime=s.runtime||{};
 opencodeBadge('opencode-install-state',s.installed?('OpenCode '+(s.version||'已安装')):(s.install_running?'OpenCode 正在安装':'OpenCode 未安装'),s.installed?'opencode-ok':'opencode-warn');
 opencodeBadge('opencode-terminal-state',s.service_running?'终端运行中':'终端未运行',s.service_running?'opencode-ok':'opencode-warn');
 opencodeBadge('opencode-auth-state',s.authenticated?'提供商已连接':'提供商未连接',s.authenticated?'opencode-ok':'opencode-warn');
 opencodeText('opencode-runtime-state',runtime.ready?('共享运行时：Node '+runtime.node+' · npm '+runtime.npm+' · '+runtime.abi):(runtime.error||'共享运行时未准备'),runtime.ready?'opencode-ok':'opencode-warn');
 var install=document.getElementById('opencode-install');install.disabled=!!s.install_running;install.value=s.installed?'重新安装固定版本':(s.install_running?'正在安装…':'安装 OpenCode');
 document.getElementById('opencode-recover').style.display=s.interrupted?'inline-block':'none';
 var terminal=document.getElementById('opencode-terminal');terminal.href=opencodeTerminalUrl;terminal.style.display=s.service_running?'inline-block':'none';
 opencodeAgentFlow(s.agentflow);
}
function opencodeOperation(operation){
 (new XHR()).post(opencodeInstallUrl,{token:opencodeToken,operation:operation},function(x,data){
  data=data||{};if(!data.ok){alert(data.error||'操作失败');return}
  if(data.task_id&&window.taskd)window.taskd.show_log(data.task_id,false,function(){location.reload()});
  else location.reload();
 });
}
XHR.poll(5,opencodeStatusUrl,null,function(x,s){opencodeRender(s)});
//]]>
</script>
<section class="opencode-shell" aria-labelledby="opencode-heading">
 <div class="opencode-main">
  <div><h3 id="opencode-heading" class="opencode-title">OpenCode</h3><p class="opencode-muted">在 iStoreOS 上安全运行 OpenCode 命令行，也可以交给 AgentFlow 提供网页工作流。</p><div class="opencode-badges"><span id="opencode-install-state" class="opencode-badge">检查中…</span><span id="opencode-terminal-state" class="opencode-badge">检查中…</span><span id="opencode-auth-state" class="opencode-badge">检查中…</span></div></div>
  <div class="opencode-actions"><a id="opencode-terminal" class="btn cbi-button cbi-button-apply opencode-button" target="_blank" rel="noopener" style="display:none">打开 OpenCode 命令行</a><a id="opencode-agentflow" class="btn cbi-button opencode-button opencode-secondary" rel="noopener">检查 AgentFlow…</a></div>
 </div>
 <div class="opencode-detail"><div class="opencode-detail-copy"><strong id="opencode-runtime-state" class="opencode-state">检查共享运行时…</strong><br>模型提供商凭据仅保存在专用 OpenCode HOME；未登录时请在命令行执行 <code>opencode auth login</code>。</div><div class="opencode-maintenance"><a class="btn cbi-button" href="<%=url('admin/services/mise')%>">运行时环境</a><input id="opencode-install" class="btn cbi-button" type="button" value="安装 OpenCode" onclick="opencodeOperation('install')"><input id="opencode-recover" class="btn cbi-button" style="display:none" type="button" value="恢复中断安装" onclick="opencodeOperation('recover')"></div></div>
</section>
